name: "morpheus3d-refine"
tag: "${rmspace:${basename:${data.image_path}},_}"
exp_root_dir: "outputs"
seed: 2

data_type: "single-image-datamodule"
data:
  image_path: ???
  width: 512
  height: 512
  default_elevation_deg: 0.0
  default_azimuth_deg: 0.0
  default_camera_distance: 2.5
  default_fovy_deg: 40.0
  random_camera:
    batch_size: 1
    height: 512
    width: 512
    elevation_range: [-45, 45]
    azimuth_range: [-180, 180]
    camera_distance_range: [2.5, 2.5]
    fovy_range: [40.0, 40.0]
    camera_perturb: 0.0
    center_perturb: 0.0
    up_perturb: 0.0
    eval_height: 512
    eval_width: 512
    eval_elevation_deg: ${data.default_elevation_deg}
    eval_camera_distance: ${data.default_camera_distance}
    eval_fovy_deg: ${data.default_fovy_deg}
    n_val_views: 8
    n_test_views: 100

system_type: "morpheus3d-system"
system:
  stage: refine
  geometry_convert_from: ???
  geometry_convert_inherit_texture: true
  geometry_type: "tetrahedra-sdf-grid"
  geometry:
    radius: 1.0
    isosurface_resolution: 128
    isosurface_deformable_grid: true
    pos_encoding_config:
      otype: HashGrid
      n_levels: 16
      n_features_per_level: 2
      log2_hashmap_size: 19
      base_resolution: 16
      per_level_scale: 1.447269237440378
    mlp_network_config:
      otype: "VanillaMLP"
      activation: "ReLU"
      output_activation: "none"
      n_neurons: 64
      n_hidden_layers: 2
    fix_geometry: false

  material_type: "no-material"

  background_type: "solid-color-background"

  renderer_type: "nvdiff-rasterizer"
  renderer:
    context_type: cuda

  prompt_processor_type: "None"

  guidance_type: "None"

  guidance_3d_type: "zero123-sds-guidance"
  guidance_3d:
    pretrained_model_name_or_path: "./diffusion_ckpt/zero123-xl-diffusers-base"
    guidance_scale: 3.0
    min_step_percent: 0.02
    max_step_percent: 0.5
    cond_image_path: ${data.image_path}
    cond_elevation_deg: ${data.default_elevation_deg}
    cond_azimuth_deg: ${data.default_azimuth_deg}
    cond_camera_distance: ${data.default_camera_distance}

    cal_sds_in_freq: False

  guidance_clip_type: "None"

  guidance_depth_type: "None"

  loggers:
    wandb:
      enable: false
      project: "threestudio"
      name: None

  loss:
    lambda_3d_sds: 1.
    lambda_c: 0.0002
    lambda_sigma: 1.
    lambda_normal_consistency: 1.
    lambda_laplacian_smoothness: 1.
    lambda_scale: 1000.
    lambda_clip: 0.
  optimizer:
    name: Adam
    args:
      lr: 0.001
      betas: [0.9, 0.99]
      eps: 1.e-8

trainer:
  max_steps: 5000
  log_every_n_steps: 1
  num_sanity_val_steps: 1
  val_check_interval: 100
  enable_progress_bar: true
  precision: 32

checkpoint:
  save_last: true
  save_top_k: -1
  every_n_train_steps: ${trainer.max_steps}
