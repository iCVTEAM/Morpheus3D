name: "morpheus3d-coarse"
tag: "${rmspace:${basename:${data.image_path}},_}"
exp_root_dir: "outputs"
seed: 1314

data_type: "single-image-datamodule"
data:
  image_path: ???
  width: 128
  height: 128
  default_elevation_deg: 0.0
  default_azimuth_deg: 0.0
  default_camera_distance: 2.5
  default_fovy_deg: 40.0
  random_camera:
    batch_size: 1
    height: 128
    width: 128
    elevation_range: [-45, 45]
    azimuth_range: [-180, 180]
    camera_distance_range: [2.5, 2.5]
    fovy_range: [40.0, 40.0]
    camera_perturb: 0.0
    center_perturb: 0.0
    up_perturb: 0.0
    eval_height: 512
    eval_width: 512
    eval_elevation_deg: ${data.default_elevation_deg}
    eval_camera_distance: ${data.default_camera_distance}
    eval_fovy_deg: ${data.default_fovy_deg}
    n_val_views: 8
    n_test_views: 100

system_type: "morpheus3d-system"
system:
  stage: coarse
  geometry_type: "implicit-volume"
  geometry:
    radius: 1.0
    normal_type: analytic

    density_bias: "blob_magic3d"
    density_activation: softplus
    density_blob_scale: 10.
    density_blob_std: 0.5

    pos_encoding_config:
      otype: ProgressiveBandHashGrid
      n_levels: 16
      n_features_per_level: 2
      log2_hashmap_size: 19
      base_resolution: 16
      per_level_scale: 1.447269237440378
      start_level: 8
      start_step: 2000
      update_steps: 300
    mlp_network_config:
      otype: "VanillaMLP"
      activation: "ReLU"
      output_activation: "none"
      n_neurons: 64
      n_hidden_layers: 2

  material_type: "no-material"
  material:
    requires_normal: true

  background_type: "solid-color-background"

  renderer_type: "nerf-volume-renderer"
  renderer:
    radius: ${system.geometry.radius}
    estimator: occgrid
    num_samples_per_ray: 256
    return_comp_normal: true

  prompt_processor_type: "None"

  guidance_type: "None"

  guidance_3d_type: "zero123-sds-guidance"
  guidance_3d:
    pretrained_model_name_or_path: "./diffusion_ckpt/zero123-xl-diffusers-base"
    guidance_scale: 3.0
    min_step_percent: 0.02
    max_step_percent: [5000, 0.98, 0.5, 5001]

    cond_image_path: ${data.image_path}
    cond_elevation_deg: ${data.default_elevation_deg}
    cond_azimuth_deg: ${data.default_azimuth_deg}
    cond_camera_distance: ${data.default_camera_distance}

    cal_sds_in_freq: False

  guidance_clip_type: "None"

  guidance_depth_type: 'None'

  loggers:
    wandb:
      enable: false
      project: "threestudio"
      name: None

  loss:
    lambda_3d_sds: 1.
    lambda_c: 0.0002
    lambda_sigma: 1.
    lambda_orient: 0.
    lambda_sparsity: 0.
    lambda_opaque: 0.
    lambda_z_variance: 0.
    lambda_scale: 1000.
    lambda_clip: 0.
    lambda_depth: 0.
    lambda_normal_smoothness: 1.
  optimizer:
    name: Adam
    args:
      betas: [0.9, 0.99]
      eps: 1.e-8
    params:
      geometry.encoding:
        lr: 0.01
      geometry.density_network:
        lr: 0.001
      geometry.feature_network:
        lr: 0.001

trainer:
  max_steps: 10000
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  val_check_interval: 100
  enable_progress_bar: true
  precision: 32

checkpoint:
  save_last: true
  save_top_k: -1
  every_n_train_steps: ${trainer.max_steps}
